openapi: 3.2.1

info:
  title: Yanki Cards Service API
  description: |
    API REST reactiva para la gestión de tarjetas de crédito y débito de la plataforma bancaria Yanki.

    **Arquitectura Hexagonal:** El servicio sigue el patrón de Puertos y Adaptadores con:
    - Dominio puro sin dependencias de infraestructura
    - Puertos de entrada (use cases) y puertos de salida (persistencia, caché, eventos)
    - Adaptadores MongoDB, Redis y Kafka en la capa de infraestructura

    **Características principales:**
    - Emisión de tarjetas de crédito y débito con validación de riesgo
    - Registro y consulta de consumos con control de límites
    - Bloqueo y desbloqueo de tarjetas
    - Pagos y reembolsos
    - Estado de cuenta mensual
    - Eventos asíncronos vía Kafka
    - Caché de tarjetas vía Redis

    **Tecnologías:** Spring Boot 3.3.5, Reactor, RxJava 3, MongoDB, Redis, Kafka

  version: 1.0.0
  contact:
    name: Yanki Platform Team
    email: yanki-platform@yanki.com
  license:
    name: Proprietary
    url: https://yanki.com/license

servers:
  - url: http://localhost:8083
    description: Servidor local de desarrollo
  - url: https://staging.yanki.com/cards-service
    description: Entorno de staging
  - url: https://api.yanki.com/cards-service
    description: Entorno de producción

tags:
  - name: Cards
    description: Operaciones CRUD y de estado sobre tarjetas de crédito y débito
  - name: Consumptions
    description: Registro, consulta y reembolso de consumos de tarjetas
  - name: Payments
    description: Pagos y estado de cuenta de tarjetas de crédito

paths:
  /api/cards:
    get:
      tags:
        - Cards
      summary: Lista todas las tarjetas
      description: |
        Devuelve la colección completa de tarjetas registradas en el sistema,
        incluyendo tarjetas de crédito y débito en todos los estados (ACTIVE, BLOCKED, CLOSED, EXPIRED).

        **Permisos:** Requiere autenticación válida.
        **Caché:** Los resultados pueden estar cacheados en Redis (TTL 5 minutos).
      operationId: getAllCards
      responses:
        '200':
          description: Lista de tarjetas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
              example:
                - id: card-123
                  customerId: CLI-1001
                  type: CREDIT
                  subtype: PERSONAL
                  status: ACTIVE
                  cardNumber: "****1234"
                  expiryDate: "2028-12-31T23:59:59"
                  creditLimit: 5000.00
                  availableLimit: 5000.00
                  linkedAccountId: null
                  issuedAt: "2026-01-15T10:00:00"
                  activatedAt: "2026-01-16T08:00:00"
                  createdAt: "2026-01-15T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 500
                error: Internal Server Error
                code: INTERNAL_ERROR
                message: Error interno del servidor
                path: /api/cards

    post:
      tags:
        - Cards
      summary: Emite una nueva tarjeta
      description: |
        Crea una nueva tarjeta de crédito o débito para el cliente especificado.

        **Validaciones de negocio:**
        - Para tarjetas de crédito: se valida que el cliente no tenga deuda vencida y que no exista ya una tarjeta de crédito personal.
        - Para tarjetas de débito: se requiere una cuenta bancaria vinculada (`linkedAccountId`).
        - El cliente debe existir y tener estado ACTIVE.
        - El límite de crédito debe ser mayor a cero para tarjetas de crédito.

        **Eventos publicados:** `CardOpenedEvent` vía Kafka tras emisión exitosa.

        **Referencia:** CP-001, CP-002, CP-003
      operationId: issueCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
            examples:
              tarjeta_credito:
                summary: Tarjeta de crédito personal
                value:
                  customerId: "CLI-1001"
                  type: CREDIT
                  subtype: PERSONAL
                  creditLimit: 10000.00
                  linkedAccountId: null
              tarjeta_debito:
                summary: Tarjeta de débito
                value:
                  customerId: "CLI-1001"
                  type: DEBIT
                  subtype: PERSONAL
                  creditLimit: null
                  linkedAccountId: "ACC-5001"
      responses:
        '201':
          description: Tarjeta emitida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
              example:
                id: card-123
                customerId: CLI-1001
                type: CREDIT
                subtype: PERSONAL
                status: ACTIVE
                cardNumber: "****1234"
                expiryDate: "2028-12-31T23:59:59"
                creditLimit: 10000.00
                availableLimit: 10000.00
                linkedAccountId: null
                issuedAt: "2026-11-14T10:00:00"
                activatedAt: "2026-11-14T10:00:00"
                createdAt: "2026-11-14T10:00:00"
        '400':
          description: Solicitud inválida (tipo de tarjeta no válido o límite de crédito inválido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                account_required_for_debit:
                  summary: Tarjeta de débito sin cuenta vinculada
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 400
                    error: Bad Request
                    code: ACCOUNT_REQUIRED_FOR_DEBIT
                    message: La tarjeta de débito requiere una cuenta vinculada
                    path: /api/cards
                invalid_credit_limit:
                  summary: Límite de crédito inválido
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 400
                    error: Bad Request
                    code: INVALID_CREDIT_LIMIT
                    message: El límite de crédito debe ser mayor a cero
                    path: /api/cards
        '403':
          description: El cliente tiene deuda vencida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 403
                error: Forbidden
                code: CUSTOMER_HAS_OVERDUE_DEBT
                message: El cliente tiene deuda vencida
                path: /api/cards
        '404':
          description: El cliente no existe en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CUSTOMER_NOT_FOUND
                message: El cliente no existe en el sistema
                path: /api/cards
        '409':
          description: Conflicto (tarjeta ya existe o cliente no activo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                  tarjeta_duplicada:
                    summary: Ya existe tarjeta de crédito personal
                    value:
                      timestamp: "2026-11-14T18:00:00Z"
                      status: 409
                      error: Conflict
                      code: PERSONAL_CREDIT_CARD_ALREADY_EXISTS
                      message: Ya existe una tarjeta de crédito personal para este cliente
                      path: /api/cards
                  cliente_no_activo:
                    summary: Cliente no activo
                    value:
                      timestamp: "2026-11-14T18:00:00Z"
                      status: 409
                      error: Conflict
                      code: CUSTOMER_NOT_ACTIVE
                      message: El cliente no tiene estado activo
                      path: /api/cards
        '422':
          description: Tipo de tarjeta no soportado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 422
                error: Unprocessable Entity
                code: INVALID_CARD_TYPE
                message: Tipo de tarjeta no válido
                path: /api/cards
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}:
    get:
      tags:
        - Cards
      summary: Obtiene el detalle de una tarjeta
      description: |
        Devuelve toda la información de una tarjeta específica por su identificador,
        incluyendo estado, límites, fechas y cuenta vinculada.

        **Caché:** El resultado puede provenir de Redis (TTL 5 minutos) si está disponible.
      operationId: getCard
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      responses:
        '200':
          description: Detalle de la tarjeta obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
              example:
                id: card-123
                customerId: CLI-1001
                type: CREDIT
                subtype: PERSONAL
                status: ACTIVE
                cardNumber: "****1234"
                expiryDate: "2028-12-31T23:59:59"
                creditLimit: 10000.00
                availableLimit: 8500.00
                linkedAccountId: null
                issuedAt: "2026-01-15T10:00:00"
                activatedAt: "2026-01-16T08:00:00"
                createdAt: "2026-01-15T10:00:00"
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      tags:
        - Cards
      summary: Cierra una tarjeta
      description: |
        Cierra permanentemente una tarjeta de crédito o débito.

        **Validaciones de negocio:**
        - Para tarjetas de crédito: se valida que no haya saldo pendiente (consumos autorizados no liquidados).
        - La tarjeta debe estar en estado ACTIVE o BLOCKED para poder ser cerrada.
        - Una vez cerrada, la tarjeta no puede ser reactivada.

        **Eventos publicados:** `CardClosedEvent` vía Kafka tras cierre exitoso.
      operationId: closeCard
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      responses:
        '204':
          description: Tarjeta cerrada exitosamente (sin contenido)
        '403':
          description: La tarjeta no está activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 403
                error: Forbidden
                code: CARD_NOT_ACTIVE
                message: La tarjeta no está activa
                path: /api/cards/card-123
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123
        '409':
          description: La tarjeta ya está cerrada o tiene saldo pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                tarjeta_ya_cerrada:
                  summary: Tarjeta ya cerrada
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 409
                    error: Conflict
                    code: CARD_ALREADY_CLOSED
                    message: La tarjeta ya está cerrada
                    path: /api/cards/card-123
                saldo_pendiente:
                  summary: Saldo pendiente
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 409
                    error: Conflict
                    code: OUTSTANDING_BALANCE
                    message: La tarjeta tiene saldo pendiente
                    path: /api/cards/card-123
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/block:
    put:
      tags:
        - Cards
      summary: Bloquea una tarjeta
      description: |
        Bloquea una tarjeta activa impidiendo su uso para nuevas transacciones.
        Se puede especificar un motivo opcional para el bloqueo.
        La tarjeta debe estar en estado ACTIVE para poder ser bloqueada.

        **Eventos publicados:** `CardBlockedEvent` vía Kafka tras bloqueo exitoso.
      operationId: blockCard
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCardRequest'
            example:
              reason: Tarjeta reportada como perdida
      responses:
        '200':
          description: Tarjeta bloqueada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
              example:
                id: card-123
                customerId: CLI-1001
                type: CREDIT
                subtype: PERSONAL
                status: BLOCKED
                cardNumber: "****1234"
                expiryDate: "2028-12-31T23:59:59"
                creditLimit: 10000.00
                availableLimit: 8500.00
                linkedAccountId: null
                issuedAt: "2026-01-15T10:00:00"
                activatedAt: "2026-01-16T08:00:00"
                createdAt: "2026-01-15T10:00:00"
        '403':
          description: La tarjeta no está activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 403
                error: Forbidden
                code: CARD_NOT_ACTIVE
                message: La tarjeta no está activa
                path: /api/cards/card-123/block
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123/block
        '409':
          description: La tarjeta ya está bloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 409
                error: Conflict
                code: CARD_ALREADY_BLOCKED
                message: La tarjeta ya está bloqueada
                path: /api/cards/card-123/block
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/unblock:
    put:
      tags:
        - Cards
      summary: Desbloquea una tarjeta
      description: |
        Restaura el estado ACTIVE de una tarjeta previamente bloqueada,
        permitiendo nuevamente su uso para transacciones.
        La tarjeta debe estar en estado BLOCKED para poder ser desbloqueada.

        **Eventos publicados:** `CardUnblockedEvent` vía Kafka tras desbloqueo exitoso.
      operationId: unblockCard
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      responses:
        '200':
          description: Tarjeta desbloqueada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
              example:
                id: card-123
                customerId: CLI-1001
                type: CREDIT
                subtype: PERSONAL
                status: ACTIVE
                cardNumber: "****1234"
                expiryDate: "2028-12-31T23:59:59"
                creditLimit: 10000.00
                availableLimit: 8500.00
                linkedAccountId: null
                issuedAt: "2026-01-15T10:00:00"
                activatedAt: "2026-01-16T08:00:00"
                createdAt: "2026-01-15T10:00:00"
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123/unblock
        '409':
          description: La tarjeta no está bloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 409
                error: Conflict
                code: CARD_NOT_BLOCKED
                message: La tarjeta no está bloqueada
                path: /api/cards/card-123/unblock
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/limit:
    get:
      tags:
        - Cards
      summary: Consulta el límite disponible
      description: |
        Devuelve el límite de crédito total, el monto consumos autorizados y el límite disponible
        actual de una tarjeta de crédito. No aplica para tarjetas de débito.

        **Caché:** El resultado puede estar cacheado en Redis (TTL 2 minutos).
      operationId: getCardLimit
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta de crédito
          schema:
            type: string
          example: card-123
      responses:
        '200':
          description: Límite obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitResponse'
              example:
                cardId: card-123
                creditLimit: 10000.00
                availableLimit: 8500.00
                consumedAmount: 1500.00
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123/limit
        '422':
          description: La consulta de límite no aplica para este tipo de tarjeta (ej. tarjeta de débito)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 422
                error: Unprocessable Entity
                code: LIMIT_NOT_APPLICABLE
                message: La consulta de límite no aplica para este tipo de tarjeta
                path: /api/cards/card-123/limit
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/consumptions:
    get:
      tags:
        - Consumptions
      summary: Lista los consumos de una tarjeta
      description: |
        Devuelve la colección completa de consumos registrados para una tarjeta específica,
        incluyendo consumos autorizados, liquidados y reembolsados.
      operationId: getConsumptions
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      responses:
        '200':
          description: Lista de consumos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsumptionResponse'
              example:
                - id: cons-123
                  cardId: card-123
                  customerId: CLI-1001
                  amount: 150.50
                  merchantId: merchant-001
                  description: Compra en supermercado
                  status: AUTHORIZED
                  paymentId: null
                  occurredAt: "2026-11-14T12:00:00"
                  settledAt: null
                  createdAt: "2026-11-14T12:00:00"
                  updatedAt: "2026-11-14T12:00:00"
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123/consumptions
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      tags:
        - Consumptions
      summary: Registra un consumo
      description: |
        Registra un nuevo consumo en la tarjeta indicada.

        **Validaciones de negocio:**
        - Para tarjetas de crédito: valida el límite disponible y autoriza el consumo si hay saldo suficiente.
        - Para tarjetas de débito: inicia el flujo asíncrono de pago desde la cuenta vinculada.
        - La tarjeta debe estar en estado ACTIVE.
        - El monto debe ser mayor a cero.

        **Eventos publicados:** `ConsumptionRegisteredEvent` vía Kafka tras registro exitoso.
      operationId: registerConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsumptionRequest'
            example:
              amount: 150.50
              merchantId: merchant-001
              description: Compra en supermercado
      responses:
        '201':
          description: Consumo registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumptionResponse'
              example:
                id: cons-123
                cardId: card-123
                customerId: CLI-1001
                amount: 150.50
                merchantId: merchant-001
                description: Compra en supermercado
                status: AUTHORIZED
                paymentId: null
                occurredAt: "2026-11-14T12:00:00"
                settledAt: null
                createdAt: "2026-11-14T12:00:00"
                updatedAt: "2026-11-14T12:00:00"
        '400':
          description: Monto inválido o límite de crédito insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                monto_invalido:
                  summary: Monto inválido
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 400
                    error: Bad Request
                    code: INVALID_AMOUNT
                    message: El monto debe ser mayor a cero
                    path: /api/cards/card-123/consumptions
                limite_insuficiente:
                  summary: Límite de crédito insuficiente
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 400
                    error: Bad Request
                    code: INSUFFICIENT_CREDIT_LIMIT
                    message: Límite de crédito insuficiente para el consumo
                    path: /api/cards/card-123/consumptions
        '403':
          description: La tarjeta está bloqueada, vencida o no está activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                tarjeta_bloqueada:
                  summary: Tarjeta bloqueada
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 403
                    error: Forbidden
                    code: CARD_BLOCKED
                    message: La tarjeta está bloqueada
                    path: /api/cards/card-123/consumptions
                tarjeta_vencida:
                  summary: Tarjeta vencida
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 403
                    error: Forbidden
                    code: CARD_EXPIRED
                    message: La tarjeta está vencida
                    path: /api/cards/card-123/consumptions
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123/consumptions
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/consumptions/{consumptionId}:
    get:
      tags:
        - Consumptions
      summary: Obtiene el detalle de un consumo
      description: |
        Devuelve la información completa de un consumo específico identificado por su ID
        y la tarjeta asociada, incluyendo monto, comercio, estado y fechas.
      operationId: getConsumptionDetail
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
        - name: consumptionId
          in: path
          required: true
          description: Identificador único del consumo
          schema:
            type: string
          example: cons-456
      responses:
        '200':
          description: Detalle del consumo obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumptionResponse'
              example:
                id: cons-456
                cardId: card-123
                customerId: CLI-1001
                amount: 250.00
                merchantId: merchant-002
                description: Compra en farmacia
                status: SETTLED
                paymentId: null
                occurredAt: "2026-11-13T15:30:00"
                settledAt: "2026-11-14T00:00:00"
                createdAt: "2026-11-13T15:30:00"
                updatedAt: "2026-11-14T00:00:00"
        '404':
          description: El consumo o la tarjeta no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                tarjeta_no_existe:
                  summary: Tarjeta no encontrada
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 404
                    error: Not Found
                    code: CARD_NOT_FOUND
                    message: La tarjeta no existe
                    path: /api/cards/card-123/consumptions/cons-456
                consumo_no_existe:
                  summary: Consumo no encontrado
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 404
                    error: Not Found
                    code: CONSUMPTION_NOT_FOUND
                    message: El consumo no existe
                    path: /api/cards/card-123/consumptions/cons-456
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/consumptions/{consumptionId}/refund:
    post:
      tags:
        - Consumptions
      summary: Procesa el reverso de un consumo
      description: |
        Procesa el reembolso (refund) de un consumo previamente autorizado o liquidado.
        El consumo debe estar en estado AUTHORIZED o SETTLED para poder ser reembolsado.
        Al procesar el reembolso, el monto se resta de los consumos autorizados y se restaura el límite disponible.

        **Eventos publicados:** `ConsumptionRefundedEvent` vía Kafka tras reembolso exitoso.
      operationId: refundConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
        - name: consumptionId
          in: path
          required: true
          description: Identificador único del consumo a reembolsar
          schema:
            type: string
          example: cons-456
      responses:
        '200':
          description: Reembolso procesado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumptionResponse'
              example:
                id: cons-456
                cardId: card-123
                customerId: CLI-1001
                amount: 250.00
                merchantId: merchant-002
                description: Compra en farmacia
                status: REFUNDED
                paymentId: null
                occurredAt: "2026-11-13T15:30:00"
                settledAt: "2026-11-14T00:00:00"
                createdAt: "2026-11-13T15:30:00"
                updatedAt: "2026-11-15T10:00:00"
        '404':
          description: El consumo o la tarjeta no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CONSUMPTION_NOT_FOUND
                message: El consumo no existe
                path: /api/cards/card-123/consumptions/cons-456/refund
        '409':
          description: El consumo ya fue reembolsado o no es reembolsable en su estado actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ya_reembolsado:
                  summary: Consumo ya reembolsado
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 409
                    error: Conflict
                    code: CONSUMPTION_ALREADY_REFUNDED
                    message: El consumo ya fue reembolsado
                    path: /api/cards/card-123/consumptions/cons-456/refund
                no_reembolsable:
                  summary: Consumo no reembolsable
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 409
                    error: Conflict
                    code: CONSUMPTION_NOT_REFUNDABLE
                    message: El consumo no es reembolsable en su estado actual
                    path: /api/cards/card-123/consumptions/cons-456/refund
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/statement:
    get:
      tags:
        - Consumptions
      summary: Estado de cuenta mensual
      description: |
        Devuelve el estado de cuenta mensual de una tarjeta de crédito,
        incluyendo la lista de consumos del periodo, el monto total y el límite disponible.
        Si no se especifica el mes, se devuelve el estado de cuenta del mes actual.
      operationId: getStatement
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
        - name: month
          in: query
          required: false
          description: "Mes del estado de cuenta en formato YYYY-MM (ej: 2026-11). Si no se especifica, se usa el mes actual"
          schema:
            type: string
            pattern: '^YYYY-MM$'
          example: "2026-11"
      responses:
        '200':
          description: Estado de cuenta obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementResponse'
              example:
                cardId: card-123
                month: "2026-11-01"
                consumptions:
                  - id: cons-123
                    cardId: card-123
                    customerId: CLI-1001
                    amount: 150.50
                    merchantId: merchant-001
                    description: Compra en supermercado
                    status: AUTHORIZED
                    paymentId: null
                    occurredAt: "2026-11-14T12:00:00"
                    settledAt: null
                    createdAt: "2026-11-14T12:00:00"
                    updatedAt: "2026-11-14T12:00:00"
                totalAmount: 1500.00
                availableLimit: 8500.00
        '404':
          description: La tarjeta no existe o no se encontró estado de cuenta para el periodo indicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                tarjeta_no_existe:
                  summary: Tarjeta no encontrada
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 404
                    error: Not Found
                    code: CARD_NOT_FOUND
                    message: La tarjeta no existe
                    path: /api/cards/card-123/statement
                estado_cuenta_no_existe:
                  summary: Estado de cuenta no encontrado
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 404
                    error: Not Found
                    code: STATEMENT_NOT_FOUND
                    message: No se encontró estado de cuenta para el periodo indicado
                    path: /api/cards/card-123/statement
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/cards/{id}/payments:
    post:
      tags:
        - Payments
      summary: Registra un pago de tarjeta de crédito
      description: |
        Registra un pago en una tarjeta de crédito, reduciendo el saldo pendiente
        y aumentando el límite disponible. El monto debe ser mayor a cero.
        La tarjeta debe estar en estado ACTIVE.

        **Eventos publicados:** `PaymentRegisteredEvent` vía Kafka tras pago exitoso.
      operationId: registerPayment
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la tarjeta
          schema:
            type: string
          example: card-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              amount: 500.00
              sourceAccountId: acc-789
      responses:
        '201':
          description: Pago registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              example:
                cardId: card-123
                amount: 500.00
                newAvailableLimit: 9000.00
                paidAt: "2026-11-14T15:30:00"
        '400':
          description: Monto inválido o pago rechazado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                monto_invalido:
                  summary: Monto inválido
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 400
                    error: Bad Request
                    code: INVALID_AMOUNT
                    message: El monto debe ser mayor a cero
                    path: /api/cards/card-123/payments
                pago_rechazado:
                  summary: Pago con débito rechazado
                  value:
                    timestamp: "2026-11-14T18:00:00Z"
                    status: 400
                    error: Bad Request
                    code: DEBIT_PAYMENT_REJECTED
                    message: El pago con débito fue rechazado
                    path: /api/cards/card-123/payments
        '403':
          description: La tarjeta no está activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 403
                error: Forbidden
                code: CARD_NOT_ACTIVE
                message: La tarjeta no está activa
                path: /api/cards/card-123/payments
        '404':
          description: La tarjeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-14T18:00:00Z"
                status: 404
                error: Not Found
                code: CARD_NOT_FOUND
                message: La tarjeta no existe
                path: /api/cards/card-123/payments
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    CreateCardRequest:
      type: object
      description: Solicitud para emitir una nueva tarjeta de crédito o débito
      required:
        - customerId
        - type
      properties:
        customerId:
          type: string
          description: Identificador único del cliente propietario de la tarjeta
          example: CLI-1001
        type:
          type: string
          description: "Tipo de tarjeta a emitir: CREDIT (crédito) o DEBIT (débito)"
          enum:
            - CREDIT
            - DEBIT
          example: CREDIT
        subtype:
          type: string
          description: "Subtipo de tarjeta: PERSONAL, CORPORATE, VIRTUAL, FISICA"
          enum:
            - PERSONAL
            - CORPORATE
            - VIRTUAL
            - FISICA
          example: PERSONAL
          nullable: true
        creditLimit:
          type: number
          format: double
          description: Límite de crédito inicial para tarjetas de crédito (obligatorio para CREDIT, ignorado para DEBIT)
          example: 10000.00
          nullable: true
        linkedAccountId:
          type: string
          description: Identificador de la cuenta bancaria vinculada (obligatorio para tarjetas de débito)
          example: ACC-5001
          nullable: true
      example:
        customerId: CLI-1001
        type: CREDIT
        subtype: PERSONAL
        creditLimit: 10000.00
        linkedAccountId: null

    CardResponse:
      type: object
      description: Datos completos de una tarjeta de crédito o débito
      required:
        - id
        - customerId
        - type
        - status
        - createdAt
      properties:
        id:
          type: string
          description: Identificador único de la tarjeta
          example: card-123
        customerId:
          type: string
          description: Identificador del cliente propietario de la tarjeta
          example: CLI-1001
        type:
          type: string
          description: "Tipo de tarjeta: CREDIT (crédito) o DEBIT (débito)"
          enum:
            - CREDIT
            - DEBIT
          example: CREDIT
        subtype:
          type: string
          description: "Subtipo de tarjeta: PERSONAL, CORPORATE, VIRTUAL, FISICA"
          enum:
            - PERSONAL
            - CORPORATE
            - VIRTUAL
            - FISICA
          example: PERSONAL
        status:
          type: string
          description: "Estado actual de la tarjeta: ACTIVE, BLOCKED, CLOSED, EXPIRED"
          enum:
            - ACTIVE
            - BLOCKED
            - CLOSED
            - EXPIRED
          example: ACTIVE
        cardNumber:
          type: string
          description: Número de tarjeta enmascarado (solo últimos 4 dígitos visibles)
          example: "****1234"
        expiryDate:
          type: string
          format: date-time
          description: Fecha de vencimiento de la tarjeta en formato ISO-8601
          example: "2028-12-31T23:59:59"
          nullable: true
        creditLimit:
          type: number
          format: double
          description: Límite de crédito total asignado a la tarjeta (solo para tarjetas de crédito)
          example: 10000.00
          nullable: true
        availableLimit:
          type: number
          format: double
          description: Límite disponible actual (crédito total menos consumos autorizados)
          example: 8500.00
        linkedAccountId:
          type: string
          description: Identificador de la cuenta bancaria vinculada (obligatorio para tarjetas de débito)
          example: ACC-5001
          nullable: true
        issuedAt:
          type: string
          format: date-time
          description: Fecha de emisión de la tarjeta en formato ISO-8601
          example: "2026-01-15T10:00:00"
        activatedAt:
          type: string
          format: date-time
          description: Fecha de activación de la tarjeta en formato ISO-8601
          example: "2026-01-16T08:00:00"
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del registro en formato ISO-8601
          example: "2026-01-15T10:00:00"

    CreateConsumptionRequest:
      type: object
      description: Solicitud para registrar un nuevo consumo en una tarjeta
      required:
        - amount
        - merchantId
      properties:
        amount:
          type: number
          format: double
          description: Monto del consumo (debe ser mayor a cero)
          minimum: 0.01
          example: 150.50
        merchantId:
          type: string
          description: Identificador del comercio donde se realiza el consumo
          example: merchant-001
        description:
          type: string
          description: Descripción opcional del consumo o concepto de la transacción
          example: Compra en supermercado
          nullable: true
      example:
        amount: 150.50
        merchantId: merchant-001
        description: Compra en supermercado

    ConsumptionResponse:
      type: object
      description: Datos de un consumo registrado en una tarjeta
      required:
        - id
        - cardId
        - customerId
        - amount
        - merchantId
        - status
        - occurredAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Identificador único del consumo
          example: cons-123
        cardId:
          type: string
          description: Identificador de la tarjeta donde se registró el consumo
          example: card-123
        customerId:
          type: string
          description: Identificador del cliente propietario de la tarjeta
          example: CLI-1001
        amount:
          type: number
          format: double
          description: Monto del consumo en moneda local
          example: 150.50
        merchantId:
          type: string
          description: Identificador del comercio donde se realizó el consumo
          example: merchant-001
        description:
          type: string
          description: Descripción del consumo o concepto de la transacción
          example: Compra en supermercado
          nullable: true
        status:
          type: string
          description: "Estado del consumo: AUTHORIZED, SETTLED, REFUNDED, REJECTED"
          enum:
            - AUTHORIZED
            - SETTLED
            - REFUNDED
            - REJECTED
          example: AUTHORIZED
        paymentId:
          type: string
          description: Identificador del pago asociado (para consumos de débito con pago asíncrono)
          example: pay-001
          nullable: true
        occurredAt:
          type: string
          format: date-time
          description: Fecha y hora en que ocurrió el consumo en formato ISO-8601
          example: "2026-11-14T12:00:00"
        settledAt:
          type: string
          format: date-time
          description: Fecha y hora de liquidación del consumo en formato ISO-8601
          example: "2026-11-15T00:00:00"
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del registro en formato ISO-8601
          example: "2026-11-14T12:00:00"
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización en formato ISO-8601
          example: "2026-11-15T00:00:00"

    BlockCardRequest:
      type: object
      description: Solicitud para bloquear una tarjeta activa con un motivo opcional
      properties:
        reason:
          type: string
          description: Motivo del bloqueo de la tarjeta (opcional)
          example: Tarjeta reportada como perdida
          nullable: true
      example:
        reason: Tarjeta reportada como perdida

    CreatePaymentRequest:
      type: object
      description: Solicitud para registrar un pago en una tarjeta de crédito
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          description: Monto del pago a aplicar a la tarjeta (debe ser mayor a cero)
          minimum: 0.01
          example: 500.00
        sourceAccountId:
          type: string
          description: Identificador de la cuenta bancaria origen del pago (opcional)
          example: acc-789
          nullable: true
      example:
        amount: 500.00
        sourceAccountId: acc-789

    LimitResponse:
      type: object
      description: Respuesta con el detalle del límite de crédito de una tarjeta
      required:
        - cardId
        - creditLimit
        - availableLimit
        - consumedAmount
      properties:
        cardId:
          type: string
          description: Identificador de la tarjeta
          example: card-123
        creditLimit:
          type: number
          format: double
          description: Límite de crédito total asignado a la tarjeta
          example: 10000.00
        availableLimit:
          type: number
          format: double
          description: Límite disponible actual (crédito total menos consumos autorizados)
          example: 8500.00
        consumedAmount:
          type: number
          format: double
          description: Monto total consumos autorizados pendientes de pago
          example: 1500.00
      example:
        cardId: card-123
        creditLimit: 10000.00
        availableLimit: 8500.00
        consumedAmount: 1500.00

    PaymentResponse:
      type: object
      description: Respuesta confirmatoria de un pago registrado en una tarjeta de crédito
      required:
        - cardId
        - amount
        - newAvailableLimit
        - paidAt
      properties:
        cardId:
          type: string
          description: Identificador de la tarjeta donde se aplicó el pago
          example: card-123
        amount:
          type: number
          format: double
          description: Monto del pago aplicado
          example: 500.00
        newAvailableLimit:
          type: number
          format: double
          description: Nuevo límite disponible después de aplicar el pago
          example: 9000.00
        paidAt:
          type: string
          format: date-time
          description: Fecha y hora del pago en formato ISO-8601
          example: "2026-11-14T15:30:00"
      example:
        cardId: card-123
        amount: 500.00
        newAvailableLimit: 9000.00
        paidAt: "2026-11-14T15:30:00"

    StatementResponse:
      type: object
      description: Estado de cuenta mensual con el resumen de consumos y saldos de una tarjeta de crédito
      required:
        - cardId
        - consumptions
        - totalAmount
        - availableLimit
      properties:
        cardId:
          type: string
          description: Identificador de la tarjeta
          example: card-123
        month:
          type: string
          format: date
          description: Mes del estado de cuenta en formato YYYY-MM (ej: 2026-11)
          example: "2026-11-01"
          nullable: true
        consumptions:
          type: array
          description: Lista de consumos registrados en el periodo del estado de cuenta
          items:
            $ref: '#/components/schemas/ConsumptionResponse'
        totalAmount:
          type: number
          format: double
          description: Monto total de consumos en el periodo
          example: 1500.00
        availableLimit:
          type: number
          format: double
          description: Límite disponible actual de la tarjeta al cierre del periodo
          example: 8500.00
      example:
        cardId: card-123
        month: "2026-11-01"
        consumptions: []
        totalAmount: 1500.00
        availableLimit: 8500.00

    ApiError:
      type: object
      description: Respuesta de error estandarizada del API con código de negocio, mensaje y detalles
      required:
        - timestamp
        - status
        - error
        - code
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo del error en formato ISO-8601
          example: "2026-11-14T18:00:00Z"
        status:
          type: integer
          description: Código HTTP de la respuesta de error
          example: 404
        error:
          type: string
          description: Razón breve del error en inglés (estándar HTTP)
          example: Not Found
        code:
          type: string
          description: Código de error de negocio específico del dominio de tarjetas
          example: CARD_NOT_FOUND
        message:
          type: string
          description: Mensaje descriptivo del error en español para el usuario final
          example: La tarjeta no existe
        path:
          type: string
          description: Ruta HTTP donde se produjo el error
          example: /api/cards/abc123
        details:
          type: array
          description: Lista opcional de detalles adicionales sobre el error (validaciones, restricciones)
          items:
            type: string
          example:
            - El monto debe ser mayor a cero
      example:
        timestamp: "2026-11-14T18:00:00Z"
        status: 404
        error: Not Found
        code: CARD_NOT_FOUND
        message: La tarjeta no existe
        path: /api/cards/abc123
